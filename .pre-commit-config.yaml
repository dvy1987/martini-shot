# Constitution C-5.1 (secret scan mandatory) + C-1.2 (integrity grep)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Excluded: generated manifests whose content is sha256 file hashes
        # (false positives; JSON cannot carry inline allowlist pragmas).
        exclude: ^docs/harness/manifest\.json$|^docs/knowledge-graph/
  - repo: local
    hooks:
      - id: integrity-check
        name: constitution C-1.2 no-mocks/stubs grep
        entry: python scripts/integrity_check.py
        language: system
        pass_filenames: false
        files: ^(backend|frontend|scripts)/
