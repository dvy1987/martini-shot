# Shared ruff rule set for the dev venv ruff AND the pinned pre-commit hook.
# Pinned explicitly so tool-version drift can never change what "lint green"
# means (the 2026-09-01 hook-vs-venv E402/BLE001 flip-flop). Extend deliberately.
[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF100"]

[lint.per-file-ignores]
# Scripts bootstrap sys.path before backend imports; E402 is intentional there.
"scripts/*.py" = ["E402"]
