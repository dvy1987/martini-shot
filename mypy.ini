[mypy]
python_version = 3.12
ignore_missing_imports = True

# google.cloud.* are namespace packages without stubs/py.typed markers;
# suppress the parent-package attribute resolution instead of scattering
# per-line ignores through the wrappers.
[mypy-google.cloud]
ignore_missing_imports = True
follow_imports = skip

[mypy-google.auth.*]
ignore_missing_imports = True
